compose:
    services:
        api-http:
            image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
            user: 65534:65534
            command:
                - sh
                - -c
                - mkdir -p /tmp/www && cp /etc/app/config.yaml /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www
